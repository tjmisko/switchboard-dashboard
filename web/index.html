<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>switchboard · activity timeline</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <span class="dot"></span>
      <h1>switchboard<span class="sep">·</span><span class="muted">activity timeline</span></h1>
    </div>
    <div id="window-label" class="window-label" title="display window">—</div>
  </header>

  <section class="controls" aria-label="controls">
    <label class="field">
      <span>Day</span>
      <input type="date" id="day" />
    </label>
    <span class="range-group">
      <label class="field">
        <span>Since</span>
        <input type="date" id="since" />
      </label>
      <label class="field">
        <span>Until</span>
        <input type="date" id="until" />
      </label>
      <button id="clear-range" class="ghost" title="clear the range and use Day">clear range</button>
    </span>
    <span class="spacer"></span>
    <button id="refresh" class="primary">Refresh</button>
    <label class="toggle" title="re-fetch every 5s">
      <input type="checkbox" id="autorefresh" />
      <span>Auto-refresh</span>
    </label>
    <span id="status" class="req-status"></span>
  </section>

  <div id="error" class="error-banner" hidden></div>

  <main>
    <section class="summary" id="summary" aria-label="summary">
      <!-- summary cards injected here -->
    </section>

    <section class="timeline-section">
      <div class="section-head">
        <h2>Swimlanes</h2>
        <div class="legend" id="legend"></div>
      </div>
      <div class="timeline-wrap" id="timeline-wrap">
        <svg id="timeline" role="img" aria-label="session swimlanes"></svg>
        <div id="empty" class="empty" hidden>No activity for this window.</div>
      </div>
    </section>
  </main>

  <div id="tooltip" class="tooltip" hidden></div>

  <footer class="footer">
    <span>units: durations are nanoseconds (÷1e9), tokens are raw counts — contract owned by switchboard <code>docs/history-schema.md</code></span>
  </footer>

  <script src="app.js"></script>
</body>
</html>
